server {
    listen 3000;
    server_name _;
    root /app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
