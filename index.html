<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NKG MATH UNIVERSE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6d28d9; /* Original App ka theme color */
    }
    .app-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* Reverse Proxy ke zariye X-Frame-Options ko bypass karne ke liye */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Unki branding block karne ke liye bottom aur top overlay */
    .bottom-blocker {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45px;
      background-color: #4c1d95; 
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <iframe src="https://api.allorigins.win/raw?url=https://nkg-math-universe-app.base44.app"></iframe>
    
    <div class="bottom-blocker"></div>
  </div>

</body>
</html>
