<script type='text/javascript'>
  // <![CDATA[
  window.addEventListener('DOMContentLoaded', (event) => {
    // Body ke andar ke pehle se maujood content ko chupane aur full-screen karne ke liye CSS
    const style = document.createElement('style');
    style.innerHTML = `
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: 100% !important;
        overflow: hidden !important;
      }
      #my-app-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        background: white;
      }
      #my-app-frame {
        width: 100%;
        height: 100%;
        border: none;
      }
    `;
    document.head.appendChild(style);

    // Iframe container banana
    const container = document.createElement('div');
    container.id = 'my-app-container';

    // Iframe banana aur usme aapka app link set karna
    const iframe = document.createElement('iframe');
    iframe.id = 'my-app-frame';
    
    // Yaha niche apni app ka URL dalein
    iframe.src = 'AAPKE_APP_KA_URL_YAHA_DALEIN'; 

    container.appendChild(iframe);
    document.body.appendChild(container);
  });
  // ]]>
</script>
