services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
